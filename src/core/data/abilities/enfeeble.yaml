name: Enfeeble
type: Status
subtype: Status
description: >-
  Cripple your foe for 4 turns, reducing Attack and Defense by 20%. Hit chance
  scales with the caster's Intelligence against the target's Constitution.
cost: 12
wizard_free_cast: true
messages:
  resist: "{target} resists the spell."
effects:
  - type: stat_contest
    actor_stat: intel
    target_stat: con
    base_chance: 0.70
    chance_per_point: 0.02
    minimum_chance: 0.20
    maximum_chance: 0.95
    effect:
      type: dynamic_multi_debuff
      stats:
        - stat_name: Attack
          combat_attr: attack
        - stat_name: Defense
          combat_attr: defense
      percentage: 0.20
      duration: 4
